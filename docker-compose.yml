# LocalDeck — docker compose stack.
#
# ONLY the LocalDeck api and ui run here. LocalStack is managed externally by
# the user and is deliberately NOT part of this project: LocalDeck never starts,
# stops, reconfigures or wipes it.
name: localdeck

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: localdeck/api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      # LocalStack runs on the Docker host, so the default reaches it through
      # the host gateway. Override for a remote or loopback-bound instance.
      LOCALSTACK_ENDPOINT: ${LOCALSTACK_ENDPOINT:-http://host.docker.internal:4566}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      CORS_ORIGIN: '${CORS_ORIGIN:-*}'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      # Liveness only: a stopped LocalStack must not make the api unhealthy.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/api/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - localdeck

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    image: localdeck/ui:local
    restart: unless-stopped
    environment:
      # nginx proxies /api to the api service, so the browser stays same-origin.
      API_UPSTREAM: ${API_UPSTREAM:-http://api:3001}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '${UI_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - localdeck

networks:
  localdeck:
    driver: bridge
