# Override for environments where LocalStack is published on the HOST LOOPBACK
# only (127.0.0.1:4566) — typical for WSL2 with a Docker engine inside the same
# distro. Containers on a bridge network cannot reach the host loopback, so the
# api shares the host network namespace and talks to 127.0.0.1 directly; the ui
# reaches the api through the host gateway instead of the compose network.
#
#   docker compose -f docker-compose.yml -f docker-compose.loopback.yml up --build
#
# Requires Docker Compose >= 2.24: the `!reset` tag below was introduced in that
# release. `docker compose version` reports yours.
#
# Linux/WSL only: `network_mode: host` is not available on Docker Desktop for
# macOS or Windows.
services:
  api:
    network_mode: host
    # network_mode: host publishes the api directly, so the published-port
    # mapping of the base file (host loopback) is redundant.
    ports: !reset []
    networks: !reset []
    extra_hosts: !reset []
    environment:
      EMULATOR_ENDPOINT: ${EMULATOR_ENDPOINT:-${LOCALSTACK_ENDPOINT:-http://127.0.0.1:4566}}
  ui:
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:3001}
