# Dependency updates are opened weekly as a small number of grouped PRs and are
# reviewed like any other change; CI stays the gate. Dependabot security alerts
# are a repository setting, not a file — this file covers version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The api base image is pinned by digest; a major Node bump is a deliberate
      # migration, not an automated update.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /apps/ui
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The ui base images are pinned by digest; major bumps are migrations.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: nginx
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]
