# LocalDeck's CI: fast Node checks on every change, then a smoke suite that runs
# the api and ui against a throwaway LocalStack service container and drives the
# console with Playwright. LocalStack is NOT managed by LocalDeck: the container
# below exists only inside this workflow, while local/dev usage expects a
# LocalStack that the user starts and manages themselves.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-checks-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-checks-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Prettier)
        run: pnpm lint:format

      - name: Repository invariants (license, disclaimer, no secret material)
        run: pnpm verify:repo

      - name: README parity table is current
        run: pnpm gen:parity:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker image build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: ui
            dockerfile: apps/ui/Dockerfile
          - image: console
            dockerfile: apps/console/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build gate only: a broken Dockerfile or nginx template must fail the PR,
      # not the release tag. Release builds pass the real tag as APP_VERSION.
      - name: Build the ${{ matrix.image }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-ci
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-ci

  smoke:
    name: Smoke (Playwright + ${{ matrix.emulator }})
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one and only place LocalDeck ever spins up emulators: throwaway
          # service containers for this job. They never touch your own instance.
          #
          # LocalStack: the default image is the last release published before
          # LocalStack's unified-image licensing change (2026.03.0 now requires
          # an auth token to start, even in CI), so a fresh clone's pipeline is
          # green without secrets. Maintainers can point `vars.LOCALSTACK_IMAGE`
          # at a current image and set the `LOCALSTACK_AUTH_TOKEN` secret to
          # smoke-test licensed services; the expression below keeps pull
          # requests from forks on the free default image. `eks` is
          # intentionally absent from SERVICES: the free default image has no
          # EKS entitlement, so the EKS spec asserts the console's honest
          # "not enabled" page instead.
          - emulator: localstack
            image: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'localstack/localstack:4.14.0' || vars.LOCALSTACK_IMAGE || 'localstack/localstack:4.14.0' }}
            services: s3,ec2,iam,sts,sns,sqs,dynamodb,lambda,logs,events,kms,ssm,secretsmanager,cloudformation,ecr,ecs
            skip-eks: '0'
          # MiniStack: MIT, no auth token, same 4566 contract (health at
          # /_ministack/health and /_localstack/health). SERVICES filters the
          # enabled handlers. EKS is skipped: its k3s container is Docker-heavy
          # and the EKS path is covered by the LocalStack leg.
          - emulator: ministack
            image: ministackorg/ministack:latest
            services: s3,ec2,iam,sts,sns,sqs,dynamodb,logs,events,kms,ssm,secretsmanager,cloudformation,ecr,ecs
            skip-eks: '1'
          # Floci: MIT, no auth token, LocalStack-parity health at /_floci/health
          # and /_localstack/health. Its status vocabulary is inverted
          # (running = enabled), which is exactly what the provider adapter
          # normalizes; the matrix proves it end to end.
          - emulator: floci
            image: floci/floci:latest
            services: ''
            skip-eks: '1'
    services:
      emulator:
        image: ${{ matrix.image }}
        ports:
          - 4566:4566
        env:
          # Only the LocalStack image reads this; Floci and MiniStack ignore it.
          # Fork pull requests never receive the secret, which is fine because
          # the fork image expression above uses the free default image.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: ${{ matrix.services }}
          DEBUG: '0'
          PERSISTENCE: '0'
        # No --health-cmd: the LocalStack, Floci and MiniStack images ship
        # different (or no) HTTP clients, so a curl-based check never turns
        # healthy on Floci/MiniStack. The explicit readiness step below polls
        # /_localstack/health with retries instead.
        options: >-
          --volume /var/run/docker.sock:/var/run/docker.sock

    env:
      EMULATOR_ENDPOINT: http://localhost:4566
      LOCALDECK_E2E_SKIP_EKS: ${{ matrix.skip-eks }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-smoke-${{ matrix.emulator }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-smoke-${{ matrix.emulator }}-
            turbo-${{ runner.os }}-smoke-

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types, api and ui
        run: pnpm build

      - name: Confirm the CI emulator service container is reachable
        run: |
          curl --fail --silent --retry 10 --retry-connrefused --retry-all-errors \
            "${EMULATOR_ENDPOINT}/_localstack/health" | head -c 400
          echo

      - name: Install the Playwright browser
        run: pnpm --filter @localdeck/e2e exec playwright install --with-deps chromium

      # The stack spec asserts GET /api/health == 200 (LocalStack reachable) and
      # that the ui index serves and renders; the following specs create a real
      # S3 bucket and start an EKS cluster when the emulator reports EKS. The
      # build above already produced shared, api and ui, so the e2e package is
      # invoked directly instead of through `pnpm test:e2e` (which rebuilds
      # shared).
      - name: Run Playwright smoke tests (api + ui webServer)
        run: pnpm --filter @localdeck/e2e smoke

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.emulator }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  sidecar-smoke:
    name: Sidecar smoke (Floci + console image)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30

    # Proves the Floci Console Contract v1 sidecar: the single console image
    # serves the app and /api/health against a Floci container, with no
    # LocalDeck api/ui containers involved.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the console image
        run: |
          docker build -f apps/console/Dockerfile -t localdeck/console:ci --build-arg APP_VERSION=ci-${{ github.sha }} .

      - name: Start Floci and the console on a shared network
        run: |
          docker network create localdeck-sidecar
          docker run --detach --name floci --network localdeck-sidecar             -p 4566:4566 floci/floci:latest
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4566/_floci/health >/dev/null; then
              echo "Floci is healthy after ${attempt} attempt(s)"
              break
            fi
            sleep 2
          done
          docker run --detach --name console --network localdeck-sidecar             -p 4500:4500             -e AWS_ENDPOINT_URL=http://floci:4566             -e AWS_ACCESS_KEY_ID=test             -e AWS_SECRET_ACCESS_KEY=test             localdeck/console:ci

      - name: Assert the contract health shape and labels
        run: |
          for attempt in $(seq 1 60); do
            body="$(curl --silent http://127.0.0.1:4500/api/health || true)"
            status="$(printf '%s' "${body}" | jq -r '.status // empty' 2>/dev/null || true)"
            if [ "${status}" = "ok" ]; then
              printf '%s' "${body}" | jq -e '.endpoint and .console.name == "LocalDeck" and .provider.providerLabel' >/dev/null
              echo "console contract health is ok: $(printf '%s' "${body}" | jq -c '{status, provider: .provider.providerLabel, services: .emulator.counts.enabled}')"
              break
            fi
            if [ "${attempt}" = "60" ]; then
              echo "::error::the console never reported status ok"
              printf '%s' "${body}"
              exit 1
            fi
            sleep 2
          done
          docker inspect --format '{{ index .Config.Labels "io.floci.console.contract" }}' console | grep -qx '1'
          docker inspect --format '{{ index .Config.Labels "io.floci.console.health-path" }}' console | grep -qx '/api/health'
          echo "contract labels are present"

      - name: Exercise an S3 flow through the sidecar
        run: |
          curl --fail --silent --show-error -X POST             http://127.0.0.1:4500/api/services/s3/CreateBucket             -H 'content-type: application/json' -d '{"input":{"Bucket":"sidecar-smoke"}}' >/dev/null
          curl --fail --silent --show-error -X POST             http://127.0.0.1:4500/api/services/s3/ListBuckets             -H 'content-type: application/json' -d '{"input":{}}'             | jq -e '.result.Buckets | map(.Name) | index("sidecar-smoke") != null' >/dev/null
          curl --fail --silent http://127.0.0.1:4500/ | grep -q '<div id="root">'
          echo "the sidecar serves the SPA and proxies S3"

      - name: Stop the sidecar stack
        if: always()
        run: |
          docker rm --force console floci || true
          docker network rm localdeck-sidecar || true

  container-smoke:
    name: Container smoke (compose nginx, upload >1 MiB)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40

    # Runs the *shipped* images: docker compose builds apps/api and apps/ui, the
    # ui container serves the bundle through nginx and proxies /api like the
    # Quick start does. The spec uploads an object larger than nginx's 1 MiB
    # default body cap, which is exactly the regression vite preview cannot see.
    services:
      localstack:
        image: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'localstack/localstack:4.14.0' || vars.LOCALSTACK_IMAGE || 'localstack/localstack:4.14.0' }}
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: s3,ec2,iam,sts
          DEBUG: '0'
          PERSISTENCE: '0'
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    env:
      # The compose api container reaches the runner's published port through
      # the host gateway (extra_hosts in docker-compose.yml).
      LOCALSTACK_ENDPOINT: http://host.docker.internal:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      APP_VERSION: ci-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and start the compose stack
        run: docker compose up --detach --build

      - name: Wait for nginx and the api to answer through the ui container
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/api/health/live >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              echo "compose stack is healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the compose stack did not become healthy in time"
          docker compose logs --no-color
          exit 1

      - name: Install the Playwright browser
        run: pnpm --filter @localdeck/e2e exec playwright install --with-deps chromium

      - name: Run the container smoke spec (nginx upload >1 MiB)
        run: pnpm --filter @localdeck/e2e test:container

      # Screenshots are generated from the real container stack and uploaded as
      # artifacts; committing a refresh stays a developer decision (docs/screens
      # is not modified by CI).
      - name: Capture the README screenshots from the running stack
        if: success()
        env:
          LOCALDECK_SCREENSHOT_BASE_URL: http://127.0.0.1:8080
        run: pnpm --filter @localdeck/e2e screens

      - name: Upload the generated screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docs-screens
          path: docs/screens/
          retention-days: 14

      - name: Upload the container Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-playwright-report
          path: |
            e2e/playwright-report-container/
            e2e/test-results-container/
          retention-days: 7

      - name: Show the compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
