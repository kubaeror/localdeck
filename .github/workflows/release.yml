# Publishes the LocalDeck api and ui images to the GitHub Container Registry on
# semantic version tags (for example `v1.2.3`). Only the two LocalDeck images
# are built here; LocalStack is never packaged, started or modified by this
# workflow.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify the tagged revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A release tag must point at a committed tree: nothing staged, modified
      # or untracked may ride along in the release. (A fresh checkout is clean;
      # this catches submodule and tooling surprises.)
      - name: Ensure the tagged revision is clean
        run: |
          status="$(git status --porcelain)"
          if [ -n "${status}" ]; then
            echo "::error::The tagged revision has uncommitted changes; releases must be cut from a clean tree."
            printf '%s\n' "${status}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Prettier)
        run: pnpm lint:format

      - name: Repository invariants (license, disclaimer, no secret material)
        run: pnpm verify:repo

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The build must not rewrite tracked files (lockfile drift, generated
      # tables). Anything else fails the release before an image is published.
      - name: Ensure the build left the tracked tree unchanged
        run: |
          if ! git diff --exit-code; then
            echo "::error::The build modified tracked files; commit the generated output before tagging."
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.image }} to GHCR
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: ui
            dockerfile: apps/ui/Dockerfile
          - image: console
            dockerfile: apps/console/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=LocalDeck ${{ matrix.image }}
            org.opencontainers.image.description=LocalDeck — an open-source web console for LocalStack (not affiliated with Amazon Web Services)
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
